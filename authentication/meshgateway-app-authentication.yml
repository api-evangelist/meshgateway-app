note: >-
  This is a searched profile of a non-OpenAPI surface; derive-authentication.py was not run because there
  is no spec to derive from. The one secret-shaped value in the flow, the admit ticket, is minted by the
  provider and consumed by its own steward, so it is a session artefact rather than a credential class.
