problem_types:
- code: bad_bot_user_id
  status: 400
  title: Missing or malformed Discord bot user id
  observed: true
  remediation: Send bot_user_id as a string containing the bot USER snowflake (not the application id, not a token).
- code: bad_discord_app_id
  status: null
  title: Missing or malformed Discord application id
  observed: false
  note: Listed in the discovery document's errors[]; status not stated and not observed (the probe stopped at the first missing field). Presumably 400 like its sibling.
  remediation: Send discord_app_id as a string containing the Discord application / OAuth client id.
- code: tokens_not_accepted
  status: null
  title: A bot token was sent and refused
  observed: false
  note: >-
    The provider's stated security rule — never_send lists token, bot_token and discord_token — enforced
    as an error rather than silently ignored. Status not stated; not provoked by this pass.
  remediation: Remove any token field. The agent keeps its own bot token and uses it only to open the invite_url it receives back.
- code: rate_limited
  status: null
  title: Attach requests throttled
  observed: false
  note: No window or limit is published; see rate-limits/meshgateway-app-rate-limits.yml.
  remediation: Back off and retry; no Retry-After is documented.
- code: invalid_json
  status: 400
  title: Request body is not valid JSON
  observed: true
  remediation: Send Content-Type application/json with a JSON object body.
- code: method_not_allowed
  status: 405
  title: HTTP method not routed on this path
  observed: true
  note: Not in the discovery document's errors[]; observed on POST to the gateway root.
- code: ticket_missing
  status: 400
  title: Redeem called without an admit ticket
  observed: true
  host: billing.meshgateway.app
  remediation: POST the ticket returned by /attach to steward_redeem only when steward_pending.ok is false.
